<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/jetbrains-mono-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
      @font-face { font-family: "DM Sans"; src: url("assets/fonts/DMSans-Regular.ttf"); font-weight: 400; }
      @font-face { font-family: "DM Sans"; src: url("assets/fonts/DMSans-Medium.ttf"); font-weight: 500; }
      @font-face { font-family: "DM Sans"; src: url("assets/fonts/DMSans-SemiBold.ttf"); font-weight: 600; }
      @font-face { font-family: "DM Sans"; src: url("assets/fonts/DMSans-Bold.ttf"); font-weight: 700; }
      :root {
        --ground: #0c0c0a;
        --ink: #efebe0;
        --orange: #ff4d00;
        --ok: #7fc97a;
        --warn: #e8b04a;
        --danger: #ff6b5e;
        --dim: #aaa596;
        --phosphor: #9dffb0;
        --font-mono: "JetBrains Mono", monospace;
        --font-display: "DM Sans", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; }
      .scene { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="24" data-width="1920" data-height="1080">
      <!-- Scenes 1–2: hook (0–4) + reveal (4–8) -->
      <div id="intro" class="clip scene" data-composition-src="compositions/intro.html" data-start="0" data-duration="8" data-track-index="0" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <!-- Scenes 3–5: real TUI highlights (8–20) -->
      <div id="board" class="clip scene" data-composition-src="compositions/board.html" data-start="8" data-duration="12" data-track-index="0" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <!-- Scenes 6–7: payoff (20–22) + outro (22–24) -->
      <div id="outro" class="clip scene" data-composition-src="compositions/outro.html" data-start="20" data-duration="4" data-track-index="0" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <audio id="music" class="clip" src="assets/music.wav" data-start="0" data-duration="24" data-track-index="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
