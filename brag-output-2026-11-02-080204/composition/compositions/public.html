    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    const blur = (id, at) => tl.fromTo(id, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power2.out", immediateRender: false }, at);
    blur("#pu-1", 0); blur("#pu-2", 2);
    tl.fromTo("#win", { y: 40, scale: 0.97 }, { y: 0, scale: 1, duration: 0.45, ease: "expo.out" }, 0);
    ["#k0","#k1","#k2","#k3","#k4","#k5","#k6","#k7","#k8","#k9","#k10","#k11","#k12","#k13","#k14","#k15","#k16"].forEach((id, i) => tl.set(id, { opacity: 1 }, 2.4 + i * 0.125));
    // caret blinks on the half beat until typing starts, then holds steady
    for (let t = 0, on = 1; t < 2.4; t += 0.5, on = 1 - on) tl.set("#caret", { opacity: on }, t);
    tl.set("#caret", { opacity: 1 }, 2.4);
    // one caret step per typed character
    for (let i = 0; i <= 17; i++) tl.set("#caret", { x: -(17 - i) * 34.8 }, i === 0 ? 0 : 2.4 + (i - 1) * 0.125);
    // Enter: the prompt clears and the board is running
    tl.set(["#prompt"], { opacity: 0 }, 6.5);
    gsap.utils.toArray(".c2").forEach((el, i) => tl.fromTo(el, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.135, ease: "expo.out", immediateRender: false }, 6.5 + i * 0.135));
    blur("#site", 8);
    tl.to(["#pu-1", "#pu-2", "#win", "#chips2", "#site"], { opacity: 0, duration: 0.16, ease: "power1.in" }, 11.84);
    window.__timelines["public"] = tl;
  </script>
</template>
