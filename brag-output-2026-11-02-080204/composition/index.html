<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1080px; overflow: hidden; background: #0c0c0a; }
      #root { position: relative; width: 100%; height: 100%; }
      .scene { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="72" data-width="1080" data-height="1080">
      <div id="hook" data-composition-id="hook" class="clip scene" data-composition-src="compositions/hook.html" data-start="0" data-duration="10" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1080"></div>
      <div id="board" data-composition-id="board" class="clip scene" data-composition-src="compositions/board.html" data-start="10" data-duration="36" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1080"></div>
      <div id="public" data-composition-id="public" class="clip scene" data-composition-src="compositions/public.html" data-start="46" data-duration="12" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1080"></div>
      <div id="credit" data-composition-id="credit" class="clip scene" data-composition-src="compositions/credit.html" data-start="58" data-duration="14" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1080"></div>
      <audio id="music" class="clip" src="assets/music.wav" data-start="0" data-duration="72" data-track-index="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
