        - article [ref=f4e257]:
          - heading "Usage limits" [level=3] [ref=f4e258]
          - paragraph [ref=f4e259]: Shows how much of your 5-hour and weekly Claude usage you have used, and when each limit resets.
          - 'group "Example: Usage limits" [ref=f4e260]': 5h [|||||||||||| ] 58% resets 2h14m Week [|||||| ] 31% resets Thu 09:00
          - link "Read more about usage limits" [ref=f4e261] [cursor=pointer]:
            - /url: /ccstatusboard/docs/#panel-limits
        - article [ref=f4e262]:
          - heading "Burn rate" [level=3] [ref=f4e263]
          - paragraph [ref=f4e264]: Projects where each limit will end up at its reset.
          - 'group "Example: Burn rate" [ref=f4e265]': 5h NEAR LIMIT 92% at reset hits n/a Week OVER 108% at reset hits Wed
          - link "Read more about burn rate" [ref=f4e266] [cursor=pointer]:
            - /url: /ccstatusboard/docs/#panel-burn-rate
        - article [ref=f4e267]:
          - heading "Estimated cost" [level=3] [ref=f4e268]
          - paragraph [ref=f4e269]: Shows estimated spend in USD for the current block, today, this week and this month.
